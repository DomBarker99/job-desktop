# Goes to /etc/ssh/sshd_config.d/desktop.conf, which Debian's sshd_config reads first.
# Keys only: there is no password to type, and none is accepted.
PermitRootLogin no
AllowUsers desktop
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
# My own file first, then the keys the entrypoint copies in from outside.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
UseDNS no
ClientAliveInterval 60
ClientAliveCountMax 3
# So a command run over SSH can open a window on the desktop.
SetEnv DISPLAY=:1 XDG_RUNTIME_DIR=/tmp/desktop-runtime XAUTHORITY=/tmp/desktop-runtime/Xauthority DBUS_SYSTEM_BUS_ADDRESS=unix:path=/tmp/desktop-runtime/system-bus LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LANG=en_US.UTF-8
