name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dombarker99/job-desktop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built once here for the test. The publishing step below reuses these
      # layers from the cache, so what is tested is what is pushed.
      - name: Build for the test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          load: true
          tags: job-desktop:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts the image and checks the desktop, the web page, SSH and that the
      # machine survives on a volume. A failure stops here; nothing is published.
      - name: Test
        run: bash test/smoke.sh job-desktop:test "$RUNNER_TEMP/smoke"
      - name: Keep the logs and the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
      - name: Print the digest for the Deployment
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
